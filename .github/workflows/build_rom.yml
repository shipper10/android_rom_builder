name: Build LineageOS 14.1 (SM-T116)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ROM for goyave3g
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python2 bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-8-jdk
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          sudo update-java-alternatives -s java-1.8.0-openjdk-amd64 || true
          sudo sed -i 's/TLSv1, TLSv1.1, //g' /usr/lib/jvm/java-8-openjdk-amd64/jre/lib/security/java.security

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Initialize & Sync LineageOS 14.1 Source
        run: |
          export PATH=~/bin:$PATH
          git config --global user.name "shipper10"
          git config --global user.email "shipper10@users.noreply.github.com"
          git config --global color.ui false
          mkdir -p ~/android/lineage
          cd ~/android/lineage
          repo init -u https://github.com/LineageOS/android.git -b cm-14.1 --depth=1
          mkdir -p .repo/local_manifests
          cat << 'EOF' > .repo/local_manifests/goyave3g.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="shipper10/android_device_samsung_goyave3g" path="device/samsung/goyave3g" remote="github" revision="cm-14.1-ril-fix" />
            <project name="shipper10/proprietary_vendor_samsung_goyave3g" path="vendor/samsung/goyave3g" remote="github" revision="cm-14.1-ril-fix" />
            <project name="LineageOS/android_hardware_samsung" path="hardware/samsung" remote="github" revision="cm-14.1" />
          </manifest>
          EOF
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Cache CCACHE
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-goyave3g-${{ github.run_id }}
          restore-keys: |
            ccache-goyave3g-

      - name: Build ROM (goyave3g)
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
          export PATH=$JAVA_HOME/bin:~/bin:$PATH
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_DIR=~/.ccache
          ccache -M 8G
          export _JAVA_OPTIONS="-Xmx6g"
          export ANDROID_JACK_VM_ARGS="-Dfile.encoding=UTF-8 -XX:+TieredCompilation -Xmx6g"
          export JACK_SERVER_VM_ARGUMENTS="-Dfile.encoding=UTF-8 -XX:+TieredCompilation -Xmx6g"
          cd ~/android/lineage
          sed -i '/system_file:file execmod/d' system/sepolicy/domain.te
          ./prebuilts/sdk/tools/jack-admin install-server ./prebuilts/sdk/tools/jack-launcher.jar ./prebuilts/sdk/tools/jack-server-4.8.ALPHA.jar || true
          ./prebuilts/sdk/tools/jack-admin start-server || true
          source build/envsetup.sh
          lunch lineage_goyave3g-userdebug
          mka framework-res org.cyanogenmod.platform-res
          mka bacon

      - name: Upload Built ROM
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-14.1-goyave3g
          path: ~/android/lineage/out/target/product/goyave3g/lineage-14.1-*.zip
