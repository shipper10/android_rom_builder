name: Build LineageOS 14.1 (SM-T116)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3 openjdk-8-jdk
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Initialize LineageOS 14.1 Repo
        run: |
          export PATH=~/bin:$PATH
          git config --global user.email "builder@github.com"
          git config --global user.name "GitHub Builder"
          mkdir -p ~/android/lineage
          cd ~/android/lineage
          repo init -u https://github.com/LineageOS/android.git -b cm-14.1 --depth=1

      - name: Configure Local Manifests (Claude RIL Fix)
        run: |
          mkdir -p ~/android/lineage/.repo/local_manifests
          cat << 'EOF' > ~/android/lineage/.repo/local_manifests/goyave3g.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="shipper10/android_device_samsung_goyave3g" path="device/samsung/goyave3g" remote="github" revision="cm-14.1-ril-fix" />
            <project name="shipper10/proprietary_vendor_samsung_goyave3g" path="vendor/samsung/goyave3g" remote="github" revision="cm-14.1-ril-fix" />
            <project name="LineageOS/android_hardware_samsung" path="hardware/samsung" remote="github" revision="cm-14.1" />
          </manifest>
          EOF

      - name: Sync Source Code
        run: |
          export PATH=~/bin:$PATH
          cd ~/android/lineage
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags

      - name: Build ROM (goyave3g)
        run: |
          sudo apt-get update && sudo apt-get install -y python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          sudo update-java-alternatives -s java-1.8.0-openjdk-amd64 || true
          sudo sed -i 's/TLSv1, TLSv1.1, //g' /usr/lib/jvm/java-8-openjdk-amd64/jre/lib/security/java.security
          export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
          export PATH=$JAVA_HOME/bin:~/bin:$PATH
          export LC_ALL=C
          export USE_CCACHE=1
          export ANDROID_JACK_VM_ARGS="-Dfile.encoding=UTF-8 -XX:+TieredCompilation -Xmx4G"
          cd ~/android/lineage
          source build/envsetup.sh
          lunch lineage_goyave3g-userdebug
          mka bacon

      - name: Upload Built ROM to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LineageOS 14.1 SM-T116 Build #${{ github.run_number }}
          files: |
            /home/runner/android/lineage/out/target/product/goyave3g/lineage-14.1-*.zip
